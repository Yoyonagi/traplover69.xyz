<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>traplover69.xyz — SFW otokonoko gifs</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <!-- allow images from anywhere (helps on GH Pages) -->
  <meta http-equiv="Content-Security-Policy" content="img-src * data: blob:; default-src 'none'; style-src 'unsafe-inline';">
  <style>
    html, body {
      margin:0; height:100%; background:#000;
      display:grid; place-items:center; overflow:hidden; cursor:pointer;
      font:14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial; color:#e9e9f1;
    }
    img {
      max-width:100vw; max-height:100vh; object-fit:contain; display:block;
      transition:opacity .25s ease-in-out; opacity:0;
    }
    .loaded { opacity:1; }
    .hud {
      position:fixed; right:12px; top:12px; display:flex; gap:8px; pointer-events:none;
    }
    .btn {
      pointer-events:auto; cursor:pointer; padding:8px 10px; border-radius:10px;
      background:rgba(30,30,48,.8); border:1px solid rgba(255,255,255,.12); color:#e9e9f1;
    }
    .log {
      position:fixed; left:12px; top:12px; max-width:min(80vw,760px);
      background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.1); border-radius:8px;
      padding:6px 8px; font:12px/1.3 ui-monospace, Menlo, Consolas, monospace; color:#b7c0ff;
      white-space:pre-wrap; pointer-events:none;
    }
  </style>
</head>
<body>
  <img id="pic" alt="SFW otokonoko gif" referrerpolicy="no-referrer" />
  <div class="hud">
    <button id="openPost" class="btn" title="Open Danbooru post">Open post</button>
    <button id="copyLink" class="btn" title="Copy image URL">Copy link</button>
    <button id="shuffle" class="btn" title="Shuffle (Space / Enter / R)">Shuffle</button>
  </div>
  <div id="log" class="log" aria-live="polite"></div>

  <script>
    const img = document.getElementById('pic');
    const btnShuffle = document.getElementById('shuffle');
    const btnOpenPost = document.getElementById('openPost');
    const btnCopy = document.getElementById('copyLink');
    const logBox = document.getElementById('log');

    let lastPostUrl = "#";
    let lastImageUrl = "";

    function log(m) { console.log(m); logBox.textContent = String(m); }
    function setLoading(is) { btnShuffle.disabled = is; img.classList.remove('loaded'); }

    // Try to prefer CDN host if available
    function preferCdn(url) {
      try {
        const u = new URL(url);
        if (u.hostname === "danbooru.donmai.us") {
          u.hostname = "cdn.donmai.us"; // CDNs are more likely to allow embedding
          return u.toString();
        }
        return url;
      } catch { return url; }
    }

    async function fetchDanbooruGif() {
      const tags = "otokonoko rating:safe filetype:gif";
      const api = `https://danbooru.donmai.us/posts.json?limit=1&random=true&only=id,file_url,large_file_url,preview_file_url,tag_string,rating&tags=${encodeURIComponent(tags)}`;
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 12000);
      const r = await fetch(api, { headers: { accept: "application/json" }, signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error("Danbooru HTTP " + r.status);
      const arr = await r.json();
      const p = arr?.[0];
      if (!p) throw new Error("No post returned");
      // Prefer full gif; fallback to large or preview if needed
      let url = p.file_url || p.large_file_url || p.preview_file_url;
      if (!url) throw new Error("No file URL on post");
      // Make sure it's really a gif (sometimes large_file_url might be webm)
      if (!/\.gif(\?|$)/i.test(url) && p.preview_file_url && /\.gif(\?|$)/i.test(p.preview_file_url)) {
        url = p.preview_file_url;
      }
      return { url: preferCdn(url), post: `https://danbooru.donmai.us/posts/${p.id}` };
    }

    function loadIntoImg(src) {
      return new Promise((resolve, reject) => {
        img.onload = () => { requestAnimationFrame(() => img.classList.add('loaded')); resolve(); };
        img.onerror = () => reject(new Error("img.onerror for " + src));
        // reset to force onload even if same URL repeats
        img.src = "";
        requestAnimationFrame(() => { img.src = src; });
      });
    }

    async function showRandom() {
      setLoading(true);
      try {
        const { url, post } = await fetchDanbooruGif();
        lastImageUrl = url;
        lastPostUrl = post;
        log("Loading: " + url);
        await loadIntoImg(url);
        log("Loaded ✅");
      } catch (e) {
        console.error(e);
        log(e.message || "Failed to load");
      } finally {
        setLoading(false);
      }
    }

    // UI
    document.body.addEventListener('click', (e) => {
      if (e.target.closest('.btn')) return;
      showRandom();
    });
    window.addEventListener('keydown', (e) => {
      if ([" ", "Enter", "r", "R"].includes(e.key)) { e.preventDefault(); showRandom(); }
      if (e.key === "c" || e.key === "C") copyLink();
    });
    btnShuffle.addEventListener('click', showRandom);
    btnOpenPost.addEventListener('click', () => { if (lastPostUrl !== "#") window.open(lastPostUrl, "_blank", "noopener"); });
    async function copyLink() {
      if (!lastImageUrl) return;
      try { await navigator.clipboard.writeText(lastImageUrl);
        btnCopy.textContent = "Copied!"; setTimeout(()=> btnCopy.textContent="Copy link", 1200);
      } catch { alert("Copy failed :("); }
    }
    btnCopy.addEventListener('click', copyLink);

    // initial
    showRandom();
  </script>
</body>
</html>
