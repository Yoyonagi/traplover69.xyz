<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>traplover69.xyz</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <style>
    :root{
      --bg:#0a0a0f; --panel:#121225cc; --border:#24243a; --fg:#e9e9f1; --muted:#9aa0a6; --accent:#ff7ad9;
    }
    html,body{
      margin:0; height:100%; background:linear-gradient(160deg,#0a0a0f,#151526);
      color:var(--fg); font:14px/1.25 ui-sans-serif,system-ui,Inter,Segoe UI,Roboto,Arial;
      display:grid; place-items:center; overflow:hidden; cursor:pointer;
    }
    img{
      max-width:100vw; max-height:100vh; object-fit:contain; display:block; opacity:0;
      transition:opacity .25s ease-in-out, filter .25s ease-in-out;
      filter: drop-shadow(0 10px 40px rgba(0,0,0,.6));
    }
    .loaded{ opacity:1; }
    .ui{
      position:fixed; inset:12px 12px auto 12px; cursor:default; pointer-events:auto;
      display:flex; flex-direction:column; gap:10px;
      background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:10px;
      backdrop-filter: blur(8px);
    }
    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .title{ font-weight:700; letter-spacing:.3px; opacity:.9 }
    .chip{
      background:#171734; border:1px solid #2a2a46; color:var(--fg);
      padding:8px 10px; border-radius:999px; cursor:pointer; user-select:none;
      transition:background .15s, border-color .15s, transform .06s ease-in-out;
    }
    .chip:hover{ background:#1d1d3e; }
    .chip:active{ transform:scale(.98); }
    .chip.active{ background:linear-gradient(135deg,var(--accent),#ff3bb6); color:#0a0a0f; border-color:transparent; }
    .btn{
      background:#1b1b35; color:var(--fg); border:1px solid #2a2a46; border-radius:10px; padding:8px 12px;
      cursor:pointer;
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }
    .bar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .spacer{ flex:1; }
    .toast{
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      background:#0e0e1c; color:var(--muted); border:1px solid #24243a; border-radius:10px; padding:8px 12px;
      opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .toast.show{ opacity:.95; }
    .hint{
      position:fixed; right:12px; bottom:12px; color:#9aa0a6; font-size:12px; opacity:.75;
      background:#0e0e1c88; border:1px solid #24243a; border-radius:10px; padding:6px 8px; backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <img id="pic" alt="nekos.best gif" />

  <div class="ui" id="ui" onclick="event.stopPropagation()">
    <div class="row">
      <div class="title">traplover69.xyz</div>
      <div class="spacer"></div>
      <button class="btn" id="shuffleBtn" title="Shuffle (Space/Enter/R)">Shuffle</button>
      <button class="btn" id="copyBtn" title="Copy image link">Copy link</button>
    </div>

    <div class="row" id="chips"></div>
  </div>

  <div class="hint">click to shuffle • Space/Enter/R = shuffle • C = copy link</div>
  <div class="toast" id="toast" aria-live="polite"></div>

  <script>
    // All GIF categories supported by nekos.best:
    const GIF_CATEGORIES = [
      "Random","angry","baka","bite","blush","bored","cry","cuddle","dance","facepalm","feed",
      "handhold","handshake","happy","highfive","hug","kick","kiss","laugh","lurk","nod","nom",
      "nope","pat","peck","poke","pout","punch","run","shoot","shrug","slap","sleep","smile",
      "smug","stare","think","thumbsup","tickle","wave","wink","yawn","yeet"
    ];

    const img = document.getElementById('pic');
    const chipsWrap = document.getElementById('chips');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');

    let currentCat = "Random";
    let lastUrl = "";
    let requestId = 0; // ignore stale loads

    // Build chips UI
    GIF_CATEGORIES.forEach(cat => {
      const el = document.createElement('button');
      el.className = 'chip' + (cat===currentCat?' active':'');
      el.textContent = cat;
      el.dataset.cat = cat;
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        if (currentCat === cat) { showRandom(); return; }
        currentCat = cat;
        document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
        el.classList.add('active');
        showRandom(); // load immediately on change
      });
      chipsWrap.appendChild(el);
    });

    function toastMsg(msg, ms=1500){
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(()=> toast.classList.remove('show'), ms);
    }

    function setLoading(is){
      shuffleBtn.disabled = is;
      img.classList.remove('loaded');
    }

    function pickRandomCat(){
      const pool = GIF_CATEGORIES.filter(c=>c!=="Random");
      return pool[Math.floor(Math.random()*pool.length)];
    }

    async function fetchNekosBest(cat){
      const chosen = (cat === "Random") ? pickRandomCat() : cat;
      const url = `https://nekos.best/api/v2/${encodeURIComponent(chosen)}`;
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), 10000);
      const res = await fetch(url, {headers:{accept:"application/json"}, signal: ctrl.signal});
      clearTimeout(t);
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const file = json?.results?.[0]?.url;
      if(!file) throw new Error("No URL in response");
      return { file, usedCat: chosen };
    }

    function loadIntoImg(src, myId){
      return new Promise((resolve, reject)=>{
        img.onload = ()=> {
          if (myId !== requestId) return; // stale
          requestAnimationFrame(()=> img.classList.add('loaded'));
          resolve();
        };
        img.onerror = ()=> {
          if (myId !== requestId) return;
          reject(new Error("img.onerror"));
        };
        // force change to trigger onload
        img.src = "";
        requestAnimationFrame(()=> img.src = src);
      });
    }

    async function showRandom(){
      const myId = ++requestId;
      setLoading(true);
      try{
        const { file, usedCat } = await fetchNekosBest(currentCat);
        if (myId !== requestId) return; // user changed again quickly
        lastUrl = file;
        await loadIntoImg(file, myId);
        setLoading(false);
      }catch(e){
        setLoading(false);
        toastMsg("Couldn't load. Try again ✨", 1400);
      }
    }

    // Controls
    document.body.addEventListener('click', (e)=>{
      // ignore clicks inside UI panel
      if (e.target.closest('.ui')) return;
      showRandom();
    });
    window.addEventListener('keydown', (e)=>{
      if ([" ","Enter","r","R"].includes(e.key)){ e.preventDefault(); showRandom(); }
      if (e.key==="c" || e.key==="C"){ copyCurrent(); }
    });
    shuffleBtn.addEventListener('click', (e)=>{ e.stopPropagation(); showRandom(); });
    copyBtn.addEventListener('click', (e)=>{ e.stopPropagation(); copyCurrent(); });

    async function copyCurrent(){
      if (!lastUrl) return;
      try{
        await navigator.clipboard.writeText(lastUrl);
        toastMsg("Link copied ✅");
      }catch{
        toastMsg("Copy failed");
      }
    }

    // initial
    showRandom();
  </script>
</body>
</html>
