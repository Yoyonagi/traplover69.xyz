<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>traplover69.xyz — SFW otokonoko GIFs</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <style>
    html, body {
      margin: 0; height: 100%;
      background: #000; color: #e9e9f1;
      display: grid; place-items: center;
      overflow: hidden; cursor: pointer;
      font: 14px/1.25 system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    img {
      max-width: 100vw; max-height: 100vh;
      object-fit: contain; display: block;
      transition: opacity .25s ease-in-out;
      opacity: 0;
    }
    .loaded { opacity: 1; }
    .hud {
      position: fixed; right: 12px; top: 12px;
      display: flex; gap: 8px; pointer-events: none;
    }
    .btn {
      pointer-events: auto; cursor: pointer;
      padding: 8px 10px; border-radius: 10px;
      background: rgba(30,30,48,.85);
      border: 1px solid rgba(255,255,255,.12);
      color: #e9e9f1;
    }
    .log {
      position: fixed; left: 12px; top: 12px;
      max-width: min(80vw, 760px);
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px; padding: 6px 8px;
      font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace;
      color: #b7c0ff; white-space: pre-wrap; pointer-events: none;
    }
  </style>
</head>
<body>
  <img id="pic" alt="SFW otokonoko gif" referrerpolicy="no-referrer" />
  <div class="hud">
    <button id="openPost" class="btn" title="Open Danbooru post">Open post</button>
    <button id="copyLink" class="btn" title="Copy image URL">Copy link</button>
    <button id="shuffle" class="btn" title="Shuffle (Space / Enter / R)">Shuffle</button>
  </div>
  <div id="log" class="log" aria-live="polite"></div>

  <script>
    const img = document.getElementById('pic');
    const btnShuffle = document.getElementById('shuffle');
    const btnOpenPost = document.getElementById('openPost');
    const btnCopy = document.getElementById('copyLink');
    const logBox = document.getElementById('log');

    let lastPostUrl = "#";
    let lastImageUrl = "";

    function log(m) { console.log(m); logBox.textContent = String(m); }
    function setLoading(is) { btnShuffle.disabled = is; img.classList.remove('loaded'); }

    // Prefer CDN host when the link is the main site
    function preferCdn(url) {
      try {
        const u = new URL(url);
        if (u.hostname === "danbooru.donmai.us") {
          u.hostname = "cdn.donmai.us";
          return u.toString();
        }
        return url;
      } catch { return url; }
    }

    async function fetchRandomGifUrl() {
      const tags = "otokonoko rating:safe filetype:gif";
      const api = `https://danbooru.donmai.us/posts.json?limit=1&random=true&only=id,file_url,large_file_url,preview_file_url,rating,tag_string&tags=${encodeURIComponent(tags)}`;
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 12000);
      const r = await fetch(api, { headers: { accept: "application/json" }, signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error("Danbooru HTTP " + r.status);
      const arr = await r.json();
      const p = arr?.[0];
      if (!p) throw new Error("No post returned");
      // Strongly prefer a true GIF; fallback to preview if needed
      let url = p.file_url || p.large_file_url || p.preview_file_url;
      if (!url) throw new Error("No file URL on post");
      if (!/\.gif(\?|$)/i.test(url) && p.preview_file_url && /\.gif(\?|$)/i.test(p.preview_file_url)) {
        url = p.preview_file_url;
      }
      return { url: preferCdn(url), postUrl: `https://danbooru.donmai.us/posts/${p.id}` };
    }

    function loadIntoImg(src) {
      return new Promise((resolve, reject) => {
        img.onload = () => { requestAnimationFrame(() => img.classList.add('loaded')); resolve(); };
        img.onerror = () => reject(new Error("img.onerror " + src));
        // Reset first to ensure onload fires even if same src repeats
        img.src = "";
        requestAnimationFrame(() => { img.src = src; });
      });
    }

    // Try multiple random posts if the chosen GIF refuses to embed
    async function showRandom(maxTries = 5) {
      setLoading(true);
      for (let i = 1; i <= maxTries; i++) {
        try {
          const { url, postUrl } = await fetchRandomGifUrl();
          lastImageUrl = url;
          lastPostUrl = postUrl;
          log(`Try ${i}/${maxTries}\nLoading: ${url}`);
          await loadIntoImg(url);
          log("Loaded ✅");
          setLoading(false);
          return;
        } catch (e) {
          console.warn(e);
          log((e && e.message) ? e.message : "Load failed");
          // continue loop for another random pick
        }
      }
      // If we’re here, all attempts failed
      setLoading(false);
      log("All attempts failed. Press Shuffle to try again.");
    }

    // UI
    document.body.addEventListener('click', (e) => {
      if (e.target.closest('.btn')) return;
      showRandom();
    });
    window.addEventListener('keydown', (e) => {
      if ([" ", "Enter", "r", "R"].includes(e.key)) { e.preventDefault(); showRandom(); }
      if (e.key === "c" || e.key === "C") copyLink();
    });
    btnShuffle.addEventListener('click', showRandom);
    btnOpenPost.addEventListener('click', () => { if (lastPostUrl !== "#") window.open(lastPostUrl, "_blank", "noopener"); });
    async function copyLink() {
      if (!lastImageUrl) return;
      try {
        await navigator.clipboard.writeText(lastImageUrl);
        btnCopy.textContent = "Copied!";
        setTimeout(() => btnCopy.textContent = "Copy link", 1200);
      } catch { alert("Copy failed :("); }
    }
    btnCopy.addEventListener('click', copyLink);

    // initial
    showRandom();
  </script>
</body>
</html>
