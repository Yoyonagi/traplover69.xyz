<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>traplover69.xyz — SFW otokonoko gifs</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="color-scheme" content="dark" />
  <style>
    :root { --bg:#000; --fg:#e9e9f1; --muted:#9aa0a6; --accent:#ff7ad9; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg);
      display: grid; place-items: center;
      overflow: hidden; cursor: pointer;
      font: 14px/1.2 ui-sans-serif, system-ui, Inter, Segoe UI, Roboto, Arial;
      color: var(--fg);
    }
    img, video {
      max-width: 100vw; max-height: 100vh;
      object-fit: contain; display: none;
      transition: opacity .25s ease-in-out;
      opacity: 0;
    }
    .show { display: block; }
    .loaded { opacity: 1; }
    .hud {
      position: fixed; inset: 12px 12px auto auto;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      pointer-events: none;
    }
    .chip {
      pointer-events: auto;
      background: rgba(20,20,32,.65);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(6px);
      color: var(--fg);
      padding: 8px 10px; border-radius: 999px;
      user-select: none;
    }
    .btn {
      pointer-events: auto;
      background: rgba(30,30,48,.8);
      color: var(--fg);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .help {
      position: fixed; left: 12px; bottom: 12px;
      opacity: .75; color: var(--muted);
      background: rgba(12,12,20,.55);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; padding: 8px 10px;
      font-size: 12px;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    a { color: #9ad; text-decoration: underline; }
  </style>
</head>
<body>
  <img id="pic" alt="SFW otokonoko gif" referrerpolicy="no-referrer" decoding="async" />
  <video id="vid" playsinline muted loop autoplay></video>

  <div class="hud">
    <div id="modeChip" class="chip" title="Press T to toggle tag">
      <span id="modeLabel">otokonoko gifs (SFW)</span>
    </div>
    <button id="openPost" class="btn" title="Open source post (Danbooru)">Open post</button>
    <button id="copyLink" class="btn" title="Copy direct media link">Copy link</button>
    <button id="shuffle" class="btn" title="Shuffle (Space / Enter / R)">Shuffle</button>
  </div>

  <div class="help">
    click to shuffle • Space/Enter/R = shuffle • T = toggle (otokonoko ↔ astolfo) • C = copy link
  </div>

  <script>
    // --- Config ---
    // Use file_ext:gif so we get real GIFs; still handle webm/mp4 fallback if API returns those.
    const TAGS = {
      otokonoko: "otokonoko rating:safe file_ext:gif",
      astolfo: "astolfo_(fate) rating:safe file_ext:gif"
    };
    let currentMode = (new URLSearchParams(location.search).get("mode") === "astolfo") ? "astolfo" : "otokonoko";

    // --- Elements ---
    const img = document.getElementById('pic');
    const vid = document.getElementById('vid');
    const btnShuffle = document.getElementById('shuffle');
    const btnOpenPost = document.getElementById('openPost');
    const btnCopy = document.getElementById('copyLink');
    const modeLabel = document.getElementById('modeLabel');

    let lastPostUrl = "#";
    let lastMediaUrl = "";

    function setModeLabel() {
      modeLabel.textContent = (currentMode === "astolfo")
        ? "astolfo gifs (SFW)"
        : "otokonoko gifs (SFW)";
    }
    setModeLabel();

    function setLoading(is) {
      btnShuffle.disabled = is;
      img.classList.remove('loaded','show');
      vid.classList.remove('loaded','show');
      // Pause video while loading new
      try { vid.pause(); } catch {}
    }

    function isHttps(url) {
      return typeof url === "string" && url.startsWith("https://");
    }

    function showImg(url) {
      vid.classList.remove('show','loaded');
      img.src = url;
      img.onload = () => {
        img.classList.add('show');
        requestAnimationFrame(() => img.classList.add('loaded'));
      };
    }

    function showVideo(url) {
      img.classList.remove('show','loaded');
      vid.src = url;
      vid.oncanplay = () => {
        vid.classList.add('show');
        requestAnimationFrame(() => vid.classList.add('loaded'));
        vid.play().catch(()=>{});
      };
      vid.load();
    }

    async function fetchDanbooru(tags) {
      const url = `https://danbooru.donmai.us/posts.json?limit=1&random=true&tags=${encodeURIComponent(tags)}`;
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 12000);
      const res = await fetch(url, { headers: { "accept": "application/json" }, signal: ctrl.signal });
      clearTimeout(t);
      if (!res.ok) throw new Error("Danbooru HTTP " + res.status);
      const data = await res.json();
      const p = data?.[0];
      if (!p) throw new Error("No results");

      // Prefer original file_url. Fallbacks for some posts.
      const fileUrl = p.file_url || "";
      const largeUrl = p.large_file_url || "";
      const previewUrl = p.preview_file_url || "";
      const source = fileUrl || largeUrl || previewUrl;

      // Build post page
      const postPage = p.id ? `https://danbooru.donmai.us/posts/${p.id}` : "#";
      return { media: source, postPage };
    }

    function pickRenderableUrl(url) {
      // Only https (GitHub Pages blocks mixed content)
      if (!isHttps(url)) return null;
      return url;
    }

    async function showRandom() {
      setLoading(true);
      try {
        const { media, postPage } = await fetchDanbooru(TAGS[currentMode]);

        // Sometimes Danbooru returns webm/mp4 for animated content (if tag didn't restrict).
        // We try to render depending on extension.
        let url = pickRenderableUrl(media);
        if (!url) throw new Error("Non-HTTPS media URL");

        lastPostUrl = postPage;
        lastMediaUrl = url;

        const lower = url.toLowerCase();
        if (lower.endsWith(".gif")) {
          showImg(url);
        } else if (lower.endsWith(".webm") || lower.endsWith(".mp4")) {
          showVideo(url);
        } else {
          // If extension unknown, try as image first
          showImg(url);
        }
      } catch (e) {
        console.error("API error:", e);
        // Safe fallback
        lastPostUrl = "#";
        lastMediaUrl = "https://i.imgur.com/3oYh8q0.jpeg";
        showImg(lastMediaUrl);
      } finally {
        btnShuffle.disabled = false;
      }
    }

    // --- Events ---
    document.body.addEventListener('click', (e) => {
      if (e.target.closest('.btn') || e.target.closest('.chip')) return;
      showRandom();
    });

    window.addEventListener('keydown', (e) => {
      if ([" ", "Enter", "r", "R"].includes(e.key)) { e.preventDefault(); showRandom(); }
      if (e.key === "t" || e.key === "T") {
        currentMode = (currentMode === "otokonoko") ? "astolfo" : "otokonoko";
        const usp = new URLSearchParams(location.search);
        usp.set("mode", currentMode);
        history.replaceState(null, "", "?" + usp.toString());
        setModeLabel();
        showRandom();
      }
      if (e.key === "c" || e.key === "C") copyLink();
    });

    document.getElementById('shuffle').addEventListener('click', showRandom);
    document.getElementById('openPost').addEventListener('click', () => {
      if (lastPostUrl && lastPostUrl !== "#") window.open(lastPostUrl, "_blank", "noopener");
    });
    document.getElementById('copyLink').addEventListener('click', copyLink);

    async function copyLink() {
      if (!lastMediaUrl) return;
      try {
        await navigator.clipboard.writeText(lastMediaUrl);
        const btn = document.getElementById('copyLink');
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy link", 1200);
      } catch {
        alert("Copy failed :(");
      }
    }

    // initial
    showRandom();
  </script>
</body>
</html>
