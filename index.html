<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>traplover69.xyz — SFW otokonoko gifs</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;display:grid;place-items:center;
    background:#000;color:#eee;cursor:pointer;overflow:hidden}
  img{max-width:100vw;max-height:100vh;object-fit:contain;transition:opacity .25s;opacity:0}
  .loaded{opacity:1}
</style>
</head>
<body>
<img id="pic" alt="SFW otokonoko gif">
<script>
const img=document.getElementById("pic");
let gifs=[];
async function loadList(){
  const r=await fetch("gifs.json");
  gifs=await r.json();
  showRandom();
}
function showRandom(){
  if(!gifs.length)return;
  const src=gifs[Math.floor(Math.random()*gifs.length)];
  img.classList.remove("loaded");
  img.onload=()=>img.classList.add("loaded");
  img.src=src;
}
document.body.onclick=showRandom;
window.onkeydown=e=>{
  if([" ","Enter","r","R"].includes(e.key))showRandom();
};
loadList();
</script>
</body>
</html>
