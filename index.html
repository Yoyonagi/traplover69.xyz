<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>traplover69.xyz — SFW otokonoko gifs</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="color-scheme" content="dark" />
  <style>
    :root { --bg:#000; --fg:#e9e9f1; --muted:#9aa0a6; }
    html, body {
      margin:0; height:100%;
      background:var(--bg);
      display:grid; place-items:center;
      overflow:hidden; cursor:pointer;
      font:14px/1.2 ui-sans-serif,system-ui,Inter,Segoe UI,Roboto,Arial;
      color:var(--fg);
    }
    img {
      max-width:100vw; max-height:100vh;
      object-fit:contain; display:block;
      transition:opacity .25s ease-in-out;
      opacity:0;
    }
    .loaded { opacity:1; }
    .hud {
      position:fixed; right:12px; top:12px;
      display:flex; gap:8px; flex-wrap:wrap; align-items:center;
      pointer-events:none;
    }
    .btn {
      pointer-events:auto; cursor:pointer;
      background:rgba(30,30,48,.8);
      color:var(--fg);
      border:1px solid rgba(255,255,255,.12);
      border-radius:10px; padding:8px 10px;
    }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .chip {
      pointer-events:none;
      background:rgba(20,20,32,.65);
      border:1px solid rgba(255,255,255,.1);
      backdrop-filter:blur(6px);
      border-radius:999px; padding:8px 10px;
      color:var(--fg);
    }
    .help {
      position:fixed; left:12px; bottom:12px;
      opacity:.75; color:var(--muted);
      background:rgba(12,12,20,.55);
      border:1px solid rgba(255,255,255,.08);
      border-radius:10px; padding:8px 10px; font-size:12px;
      backdrop-filter:blur(4px);
      pointer-events:none;
    }
    a { color:#9ad; text-decoration:underline; }
  </style>
</head>
<body>
  <!-- Image displays directly on your site -->
  <img id="pic" alt="SFW otokonoko gif" referrerpolicy="no-referrer" />

  <div class="hud">
    <div class="chip">otokonoko gifs (SFW)</div>
    <button id="openPost" class="btn" title="Open source post (Danbooru)">Open post</button>
    <button id="copyLink" class="btn" title="Copy direct image link">Copy link</button>
    <button id="shuffle" class="btn" title="Shuffle (Space / Enter / R)">Shuffle</button>
  </div>

  <div class="help">
    click to shuffle • Space/Enter/R = shuffle • C = copy link
  </div>

  <script>
    const img = document.getElementById('pic');
    const btnShuffle = document.getElementById('shuffle');
    const btnOpenPost = document.getElementById('openPost');
    const btnCopy = document.getElementById('copyLink');

    let lastPostUrl = "#";
    let lastImageUrl = "";

    function setLoading(is) {
      btnShuffle.disabled = is;
      img.classList.remove('loaded');
    }

    async function fetchDanbooruGif() {
      const tags = "otokonoko rating:safe filetype:gif";
      const url = `https://danbooru.donmai.us/posts.json?limit=1&random=true&tags=${encodeURIComponent(tags)}`;
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 10000);
      const res = await fetch(url, { headers: { "accept": "application/json" }, signal: ctrl.signal });
      clearTimeout(timeout);
      if (!res.ok) throw new Error("Danbooru HTTP " + res.status);
      const data = await res.json();
      const p = data?.[0];
      const file = p?.file_url || p?.large_file_url || p?.source || "";
      if (!file) throw new Error("No file URL");
      return { file, id: p.id };
    }

    async function showRandom() {
      setLoading(true);
      try {
        const { file, id } = await fetchDanbooruGif();
        lastImageUrl = file;
        lastPostUrl = `https://danbooru.donmai.us/posts/${id}`;

        // Preload then swap for smooth fade-in
        const tmp = new Image();
        tmp.referrerPolicy = "no-referrer";
        tmp.onload = () => {
          img.src = file;
          requestAnimationFrame(() => img.classList.add('loaded'));
        };
        tmp.onerror = () => { throw new Error("Image failed to load"); };
        tmp.src = file;
      } catch (e) {
        console.error("API error:", e);
        // Safe fallback (static SFW)
        lastImageUrl = "https://i.imgur.com/3oYh8q0.jpeg";
        lastPostUrl = "#";
        img.src = lastImageUrl;
        requestAnimationFrame(() => img.classList.add('loaded'));
      } finally {
        setLoading(false);
      }
    }

    document.body.addEventListener('click', (e) => {
      if (e.target.closest('.btn')) return;
      showRandom();
    });

    window.addEventListener('keydown', (e) => {
      if ([" ", "Enter", "r", "R"].includes(e.key)) { e.preventDefault(); showRandom(); }
      if (e.key === "c" || e.key === "C") copyLink();
    });

    btnShuffle.addEventListener('click', showRandom);
    btnOpenPost.addEventListener('click', () => {
      if (lastPostUrl && lastPostUrl !== "#") window.open(lastPostUrl, "_blank", "noopener");
    });

    async function copyLink() {
      if (!lastImageUrl) return;
      try {
        await navigator.clipboard.writeText(lastImageUrl);
        btnCopy.textContent = "Copied!";
        setTimeout(() => btnCopy.textContent = "Copy link", 1200);
      } catch {
        alert("Copy failed :(");
      }
    }
    btnCopy.addEventListener('click', copyLink);

    // initial
    showRandom();
  </script>
</body>
</html>
