<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>traplover69.xyz — SFW otokonoko random</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <style>
    html, body {
      margin:0; height:100%;
      background:#000; color:#e9e9f1;
      display:grid; place-items:center;
      overflow:hidden; cursor:pointer;
      font:14px/1.25 system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    img {
      max-width:100vw; max-height:100vh;
      object-fit:contain; display:block;
      transition:opacity .25s ease-in-out;
      opacity:0;
    }
    .loaded { opacity:1; }
    .hud {
      position:fixed; right:12px; top:12px; display:flex; gap:8px; pointer-events:none;
    }
    .btn {
      pointer-events:auto; cursor:pointer;
      padding:8px 10px; border-radius:10px;
      background:rgba(30,30,48,.85);
      border:1px solid rgba(255,255,255,.12);
      color:#e9e9f1;
    }
    .log {
      position:fixed; left:12px; top:12px;
      max-width:min(80vw,760px);
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.12);
      border-radius:8px; padding:6px 8px;
      font:12px/1.3 ui-monospace, Menlo, Consolas, monospace;
      color:#b7c0ff; white-space:pre-wrap; pointer-events:none;
    }
  </style>
</head>
<body>
  <!-- click / Space / Enter / R = shuffle -->
  <img id="pic" alt="SFW otokonoko image" />
  <div class="hud">
    <button id="copyLink" class="btn" title="Copy image URL">Copy link</button>
    <button id="shuffle" class="btn" title="Shuffle (Space / Enter / R)">Shuffle</button>
  </div>
  <div id="log" class="log" aria-live="polite"></div>

  <script>
  /*
    How to use:
    1) Option A — edit the EMBEDDED list below (IMAGES array) with your SFW otokonoko URLs
       (ex: direct file_url from Gelbooru like https://img3.gelbooru.com/images/.../xxx.gif or .jpg)
    2) Option B — create /otokonoko.json at repo root:
       [
         "https://img3.gelbooru.com/images/ab/cd/abcdef123456.gif",
         "https://img3.gelbooru.com/images/de/f0/def012345678.jpg"
       ]
       The page will auto-load it and use that instead of the embedded list.
  */

  // --- Embedded fallback list (replace with your favs; must be direct image URLs) ---
  const IMAGES_FALLBACK = [
    // put your own SFW otokonoko links here (gif/jpg/png):
    // "https://img3.gelbooru.com/images/ab/cd/abcdef123456.gif",
    // "https://img2.gelbooru.com/images/12/34/123456789abc.jpg",
    // Temp placeholders (Imgur SFW) — replace with your own:
    "https://i.imgur.com/3oYh8q0.jpeg",
    "https://i.imgur.com/1k5m0mS.jpeg",
    "https://i.imgur.com/2zHhQ8S.jpeg"
  ];

  const img = document.getElementById('pic');
  const btnShuffle = document.getElementById('shuffle');
  const btnCopy = document.getElementById('copyLink');
  const logBox = document.getElementById('log');

  let list = [...IMAGES_FALLBACK];
  let lastUrl = "";

  function log(m){ console.log(m); logBox.textContent = String(m); }
  function setLoading(is){ btnShuffle.disabled = is; img.classList.remove('loaded'); }

  async function tryLoadExternalList() {
    try {
      const r = await fetch("otokonoko.json", { cache: "no-store" });
      if (!r.ok) throw new Error("no json");
      const arr = await r.json();
      if (Array.isArray(arr) && arr.length) {
        list = arr;
        log(`Loaded ${arr.length} URLs from otokonoko.json`);
      } else {
        log("otokonoko.json empty or invalid, using embedded list");
      }
    } catch {
      log("No otokonoko.json found, using embedded list");
    }
  }

  function pickRandom() {
    return list[Math.floor(Math.random()*list.length)];
  }

  function showRandom() {
    if (!list.length) return log("No images in list.");
    setLoading(true);
    const url = pickRandom();
    lastUrl = url;
    img.onload = () => { requestAnimationFrame(()=> img.classList.add('loaded')); setLoading(false); log("Loaded ✅"); };
    img.onerror = () => { setLoading(false); log("img.onerror " + url); };
    // force onload even if same src repeats
    img.src = "";
    requestAnimationFrame(()=> { img.src = url; log("Loading: " + url); });
  }

  // UI
  document.body.addEventListener('click', (e)=>{ if(!e.target.closest('.btn')) showRandom(); });
  window.addEventListener('keydown', (e)=>{
    if ([" ","Enter","r","R"].includes(e.key)) { e.preventDefault(); showRandom(); }
    if (e.key === "c" || e.key === "C") copyLink();
  });
  btnShuffle.addEventListener('click', showRandom);
  async function copyLink(){
    if (!lastUrl) return;
    try {
      await navigator.clipboard.writeText(lastUrl);
      btnCopy.textContent = "Copied!"; setTimeout(()=> btnCopy.textContent = "Copy link", 1200);
    } catch { alert("Copy failed :("); }
  }
  btnCopy.addEventListener('click', copyLink);

  // init
  (async ()=>{
    await tryLoadExternalList();
    showRandom();
  })();
  </script>
</body>
</html>
