<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>traplover69 — otokonoko (safe)</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; 
           background:#0b0b0c; color:#f2f3f5; display:grid; place-items:center; min-height:100dvh; }
    .card { width:min(860px, 94vw); background:#141418; border:1px solid #2a2a30; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.35);}
    header, footer { padding:14px 16px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;}
    header h1 { font-size:16px; margin:0; opacity:.85; }
    .btns { display:flex; gap:8px; }
    button, .linklike { background:#1e1e25; color:#fff; border:1px solid #32323a; padding:8px 12px; border-radius:10px; cursor:pointer; }
    button:hover, .linklike:hover { background:#262633; }
    .imgwrap { background:#0e0e12; display:grid; place-items:center; }
    img { max-width:100%; height:auto; display:block; width:auto; max-height:80vh; object-fit:contain; }
    .meta { font-size:14px; opacity:.9; }
    a { color:#8cc3ff; text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1>otokonoko — rating:safe (Danbooru)</h1>
      <div class="btns">
        <button id="next">Next</button>
        <button id="daily">Daily: OFF</button>
      </div>
    </header>

    <div class="imgwrap">
      <img id="pic" alt="otokonoko (safe)" referrerpolicy="no-referrer">
    </div>

    <footer>
      <div class="meta" id="meta">Loading…</div>
      <a id="open" class="linklike" target="_blank" rel="noopener">Open post</a>
    </footer>
  </div>

  <script>
  // Config tags: on garde safe et on exclut les tags sensibles.
  const BASE = 'https://danbooru.donmai.us/posts.json';
  const TAGS = [
    'otokonoko',
    'rating:safe',
    'order:random',
    '-loli',
    '-shota',
    '-young',
    '-toddler_con',
    '-guro',
    '-graphic'
  ].join(' ');

  const imgEl = document.getElementById('pic');
  const metaEl = document.getElementById('meta');
  const openEl = document.getElementById('open');
  const nextBtn = document.getElementById('next');
  const dailyBtn = document.getElementById('daily');

  const DAILY_KEY = 'traplover69_daily';
  let dailyMode = false;

  function setDailyUI() {
    dailyBtn.textContent = `Daily: ${dailyMode ? 'ON' : 'OFF'}`;
  }

  dailyBtn.addEventListener('click', () => {
    dailyMode = !dailyMode;
    setDailyUI();
    if (dailyMode) showDaily();
  });

  nextBtn.addEventListener('click', () => {
    // si daily mode ON, on force un refresh quotidien en purgeant
    if (dailyMode) {
      localStorage.removeItem(DAILY_KEY);
    }
    loadRandom();
  });

  function todayKey() {
    const d = new Date();
    return d.toISOString().slice(0,10); // YYYY-MM-DD
  }

  function showDaily() {
    const k = todayKey();
    const saved = JSON.parse(localStorage.getItem(DAILY_KEY) || 'null');
    if (saved && saved.date === k) {
      renderPost(saved.post);
    } else {
      loadRandom(true);
    }
  }

  async function loadRandom(saveForDaily=false) {
    try {
      metaEl.textContent = 'Loading…';
      imgEl.removeAttribute('src');

      // limit=1 suffit pour one shot
      const url = `${BASE}?tags=${encodeURIComponent(TAGS)}&limit=1`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' }});
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const posts = await res.json();
      const post = posts?.[0];
      if (!post) throw new Error('No post found');

      renderPost(post);

      if (saveForDaily || dailyMode) {
        localStorage.setItem(DAILY_KEY, JSON.stringify({ date: todayKey(), post }));
      }
    } catch (err) {
      console.error(err);
      metaEl.textContent = 'Oups… no result. Retrying with fallback.';
      // Fallback: retirer order:random (certains mirrors sont capricieux)
      try {
        const fallbackTags = TAGS.replace('order:random', ''); 
        const url = `${BASE}?tags=${encodeURIComponent(fallbackTags)}&limit=1`;
        const res = await fetch(url);
        const posts = await res.json();
        const post = posts?.[0];
        if (!post) throw new Error('Fallback also empty');
        renderPost(post);
      } catch (e2) {
        console.error(e2);
        metaEl.textContent = 'No image found (safe). Try again.';
      }
    }
  }

  function bestImageURL(post) {
    // On préfère large_file_url (hosté Danbooru) pour limiter le hotlink-block.
    return post.large_file_url || post.file_url || post.preview_file_url;
  }

  function buildArtist(post) {
    // tag_string_artist: "artist1 artist2"
    const artists = (post.tag_string_artist || '')
      .split(' ')
      .filter(Boolean)
      .map(name => name.replace(/_/g, ' '));
    return artists.length ? artists.join(', ') : null;
  }

  function renderPost(post) {
    const img = bestImageURL(post);
    const postUrl = `https://danbooru.donmai.us/posts/${post.id}`;
    const artist = buildArtist(post);
    const rating = (post.rating || 's').toUpperCase();
    const source = post.source && post.source.startsWith('http') ? post.source : null;

    if (img) {
      imgEl.src = img;
      imgEl.alt = `otokonoko (safe) • #${post.id}`;
      imgEl.loading = 'eager';
      imgEl.decoding = 'async';
    }

    openEl.href = postUrl;

    let txt = `#${post.id} • rating:${rating} • otokonoko`;
    if (artist) txt += ` • artist: ${artist}`;
    if (source) txt += ` • source: ${source}`;
    metaEl.innerHTML = txt;

    // petite sécurité: si l’image externe refuse le hotlink, tenter le preview
    imgEl.onerror = () => {
      if (post.preview_file_url && imgEl.src !== post.preview_file_url) {
        imgEl.src = post.preview_file_url;
      } else {
        metaEl.textContent = 'Image blocked by host. Click "Open post".';
      }
    };
  }

  // Init
  setDailyUI();
  dailyMode ? showDaily() : loadRandom();
  </script>
</body>
</html>
